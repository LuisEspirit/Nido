# Conexión a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bd_nido?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate/JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MAGIA AQUÍ: Respetar mayúsculas exactas de Java a MySQL (sin guiones bajos)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# MAGIA AQUÍ 2: No alterar las tablas (porque ya ejecutaste el script en MySQL)
spring.jpa.hibernate.ddl-auto=update
reporte.operacion.estados-finalizados=COMPLETADO,FINALIZADO,CANCELADO