spring.application.name=Nido

# Conexion a la base de datos MySQL
# Los valores se pueden sobrescribir con variables de entorno (por ejemplo en AWS):
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bd_nido?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# La contrasena local se guarda en application-local.properties (no se sube a GitHub)
spring.config.import=optional:classpath:application-local.properties

# Configuracion de Hibernate/JPA
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Respetar los nombres exactos de Java en MySQL (camelCase, sin guiones bajos)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# No alterar las tablas: el esquema sale del script database/bd_nido.sql
spring.jpa.hibernate.ddl-auto=none

# Estados que se consideran finalizados en el reporte de operacion (HU15)
reporte.operacion.estados-finalizados=COMPLETADO,FINALIZADO,CANCELADO

# Seguridad JWT (US01). En produccion definir la variable de entorno NIDO_JWT_SECRET (minimo 32 caracteres)
nido.jwt.secret=${NIDO_JWT_SECRET:nido-clave-de-desarrollo-cambiar-en-produccion-2026}
nido.jwt.expiracion-minutos=120

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Evidencias fotograficas de los servicios (US12)
nido.evidencias.directorio=${NIDO_EVIDENCIAS_DIR:uploads/evidencias}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
